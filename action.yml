name: reviewbrief
description: AI-powered pull request reviews with any LLM, large-PR support, and fix briefs for AI coding assistants.
author: kadraman

branding:
  icon: eye
  color: purple

inputs:
  api-key:
    description: API key for your LLM provider (pass it from a repository secret).
    required: true
  model:
    description: Model name, exactly as your provider's API expects it.
    required: true
  provider:
    description: "API protocol: 'openai' (any OpenAI-compatible API) or 'anthropic'."
    required: false
    default: openai
  base-url:
    description: Optional API root override (e.g. https://api.deepseek.com).
    required: false
    default: ""
  temperature:
    description: Sampling temperature (default 0). Set to 'none' to omit the parameter (some models reject it).
    required: false
    default: ""
  consistency-runs:
    description: Independent review passes for agreement scoring (1-5). Extra runs use CONSISTENCY_TEMPERATURE.
    required: false
    default: "1"
  max-output-tokens:
    description: Max output tokens per call (required by the Anthropic API).
    required: false
    default: "8192"
  batch-chars:
    description: Maximum diff characters packed per API call.
    required: false
    default: "100000"
  piece-chars:
    description: Max characters per file piece before hunk-splitting (keeps large files from failing as one batch). Default 20000.
    required: false
    default: "20000"
  max-batches:
    description: Cost guard. Batches beyond this are listed as not reviewed.
    required: false
    default: "40"
  workers:
    description: Number of parallel API calls.
    required: false
    default: "3"
  minimum-confidence:
    description: Confidence floor for inline comments (0..1). Inline also requires severity critical or high (medium/low/info are overview-only).
    required: false
    default: "0.85"
  max-inline-comments:
    description: Optional cap on inline review comments; 0 means no cap.
    required: false
    default: "0"
  fix-brief:
    description: "'true' to also produce fix-brief.md for an AI coding assistant."
    required: false
    default: "true"
  post-comment:
    description: "'true' to post the review as a PR comment."
    required: false
    default: "true"
  github-token:
    description: Token used to post the comment (needs pull-requests write).
    required: false
    default: ${{ github.token }}

outputs:
  review-path:
    description: Path to the generated review.md.
    value: ${{ steps.review.outputs.review_path }}
  fix-brief-path:
    description: Path to fix-brief.md (empty if there was nothing actionable).
    value: ${{ steps.review.outputs.brief_path }}
  fix-brief-url:
    description: Download URL of the uploaded fix-brief artifact.
    value: ${{ steps.upload.outputs.artifact-url }}
  findings-path:
    description: Path to findings.json (every scored finding). Empty if the file was not written.
    value: ${{ steps.review.outputs.findings_path }}
  findings-url:
    description: Download URL of the uploaded findings.json artifact.
    value: ${{ steps.upload-findings.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Compute diff
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/reviewbrief"
        mkdir -p "$out"
        if [ -z "${BASE_REF:-}" ]; then
          echo "::error::reviewbrief must run on a pull_request event."
          exit 1
        fi
        git fetch --no-tags --quiet origin "$BASE_REF" 2>/dev/null || true
        if ! git diff --no-color "origin/${BASE_REF}...HEAD" > "$out/pr.diff" 2>/dev/null; then
          echo "git diff failed (shallow checkout?); falling back to 'gh pr diff'."
          echo "Tip: use actions/checkout with fetch-depth: 0 to avoid GitHub's API diff limits."
          gh pr diff "$PR_NUMBER" > "$out/pr.diff"
        fi

    - name: Set up Node.js for the TypeScript renderer
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run review
      id: review
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        LLM_API_KEY: ${{ inputs.api-key }}
        LLM_MODEL: ${{ inputs.model }}
        LLM_PROVIDER: ${{ inputs.provider }}
        LLM_BASE_URL: ${{ inputs.base-url }}
        LLM_TEMPERATURE: ${{ inputs.temperature }}
        CONSISTENCY_RUNS: ${{ inputs.consistency-runs }}
        LLM_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        BATCH_CHARS: ${{ inputs.batch-chars }}
        PIECE_CHARS: ${{ inputs.piece-chars }}
        MAX_BATCHES: ${{ inputs.max-batches }}
        WORKERS: ${{ inputs.workers }}
        MINIMUM_CONFIDENCE: ${{ inputs.minimum-confidence }}
        MAX_INLINE_COMMENTS: ${{ inputs.max-inline-comments }}
        FIX_BRIEF: ${{ inputs.fix-brief }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD: ${{ github.head_ref }}
        PR_BASE: ${{ github.base_ref }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/reviewbrief"
        node --experimental-strip-types "$ACTION_PATH/src/reviewbrief.ts" --diff "$out/pr.diff" --out-dir "$out"
        echo "review_path=$out/review.md" >> "$GITHUB_OUTPUT"
        if [ -f "$out/fix-brief.md" ]; then
          echo "has_brief=true" >> "$GITHUB_OUTPUT"
          echo "brief_path=$out/fix-brief.md" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "$out/findings.json" ]; then
          echo "findings_path=$out/findings.json" >> "$GITHUB_OUTPUT"
        fi
        echo "review_payload_path=$out/review-payload.json" >> "$GITHUB_OUTPUT"

    - name: Upload fix brief
      id: upload
      if: steps.review.outputs.has_brief == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: fix-brief-pr-${{ github.event.pull_request.number }}
        path: ${{ steps.review.outputs.brief_path }}
        retention-days: 14

    - name: Upload findings
      id: upload-findings
      if: steps.review.outputs.findings_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: findings-pr-${{ github.event.pull_request.number }}
        path: ${{ steps.review.outputs.findings_path }}
        retention-days: 14

    - name: Post review comment
      if: inputs.post-comment == 'true' && github.event.pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REVIEW: ${{ steps.review.outputs.review_path }}
        REVIEW_PAYLOAD: ${{ steps.review.outputs.review_payload_path }}
        BRIEF_URL: ${{ steps.upload.outputs.artifact-url }}
        FINDINGS_URL: ${{ steps.upload-findings.outputs.artifact-url }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        append_downloads_to_review() {
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const [path, brief, findings] = process.argv.slice(1);
            const lines = [];
            if (brief) lines.push(`**Fix brief for an AI assistant:** [download fix-brief.md](${brief})`);
            if (findings) lines.push(`**Scored findings:** [download findings.json](${findings})`);
            if (lines.length) appendFileSync(path, `\n${lines.join("\n\n")}\n`);
          ' "$REVIEW" "${BRIEF_URL:-}" "${FINDINGS_URL:-}"
        }
        append_downloads_to_payload() {
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const [path, brief, findings] = process.argv.slice(1);
            const lines = [];
            if (brief) lines.push(`**Fix brief for an AI assistant:** [download fix-brief.md](${brief})`);
            if (findings) lines.push(`**Scored findings:** [download findings.json](${findings})`);
            if (!lines.length) process.exit(0);
            const payload = JSON.parse(readFileSync(path, "utf8"));
            payload.body = `${payload.body.trimEnd()}\n\n${lines.join("\n\n")}\n`;
            writeFileSync(path, JSON.stringify(payload, null, 2));
          ' "$REVIEW_PAYLOAD" "${BRIEF_URL:-}" "${FINDINGS_URL:-}"
        }
        INLINE_COUNT=0
        if [ -s "$REVIEW_PAYLOAD" ]; then
          INLINE_COUNT="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8")).comments.length)' "$REVIEW_PAYLOAD")"
        fi
        # Prefer a single PR review (overview + inline threads). Fall back to a summary
        # issue comment when there are no inline findings, or if create-review fails.
        if [ "$INLINE_COUNT" -gt 0 ]; then
          append_downloads_to_payload
          if gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input "$REVIEW_PAYLOAD"; then
            echo "Posted PR review with $INLINE_COUNT inline comment(s)."
          else
            echo "::warning::Inline review failed; posting summary comment only."
            append_downloads_to_review
            gh pr comment "$PR_NUMBER" --body-file "$REVIEW"
          fi
        else
          append_downloads_to_review
          gh pr comment "$PR_NUMBER" --body-file "$REVIEW"
          echo "No inline findings; posted summary comment only."
        fi
