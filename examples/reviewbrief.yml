# Copy this to .github/workflows/reviewbrief.yml in the repo you want reviewed.
#
# Settings > Secrets and variables > Actions:
#   Secret    LLM_API_KEY    your provider's API key
#   Variable  LLM_MODEL      model name (required)
#   Variable  LLM_PROVIDER   "openai" (default) or "anthropic"
#   Variable  LLM_BASE_URL   optional API root override
#
# On opened/reopened the action reviews the full PR. On synchronize it reviews
# only the new commits (before...HEAD) when that SHA is available; if nothing
# meets the publish gate, it stays silent so the earlier review remains.
# Default consistency-runs is 2: only findings seen in multiple passes are published.

name: reviewbrief

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Secrets aren't available to PRs from forks, so only review same-repo PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so large diffs aren't limited by GitHub's API
                           # and synchronize can resolve github.event.before

      - uses: kadraman/reviewbrief@v1   # or "./" when testing inside this repo
        with:
          api-key: ${{ secrets.LLM_API_KEY }}
          model: ${{ vars.LLM_MODEL }}
          provider: ${{ vars.LLM_PROVIDER || 'openai' }}
          base-url: ${{ vars.LLM_BASE_URL }}
