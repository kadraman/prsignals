# Copy this to .github/workflows/reviewbrief.yml in the repo you want reviewed.
# It calls the action in kadraman/reviewbrief. After the Marketplace listing
# exists, installing from there uses this same reference.
# The action publishes fix-brief-pr-<number> and findings-pr-<number> (kept 14 days).
# actions: write is required for those artifact uploads.
#
# Settings > Secrets and variables > Actions:
#   Secret    LLM_API_KEY    your provider's API key
#   Variable  LLM_MODEL      model name (required)
#   Variable  LLM_PROVIDER   "openai" (default) or "anthropic"
#   Variable  LLM_BASE_URL   optional API root override

name: reviewbrief

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  review:
    # Secrets aren't available to PRs from forks, so only review same-repo PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so large diffs aren't limited by GitHub's API

      - uses: kadraman/reviewbrief@v1
        with:
          api-key: ${{ secrets.LLM_API_KEY }}
          model: ${{ vars.LLM_MODEL }}
          provider: ${{ vars.LLM_PROVIDER || 'openai' }}
          base-url: ${{ vars.LLM_BASE_URL }}
